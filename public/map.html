<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mapa</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="map"></div>

    <div class="user-info">
        <button id="profile-btn">Profil</button>
        <div id="profile-panel" class="hidden">
            <h3>Uživatelský profil</h3>
            <div id="user-details">Načítání...</div>
            <a href="/profile" class="profile-btn">Zobrazit celý profil</a>
            <a href="/logout" class="logout-btn">Odhlásit se</a>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <!-- Custom JS -->
    <script src="js/map.js"></script>
</body>
</html>
