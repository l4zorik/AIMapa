<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Map - Přihlášení</title>
    <link rel="icon" href="app/icons8-favicon.gif" type="image/gif">
    <style>
        :root {
            --primary-color: #8B5CF6;
            --primary-dark: #6D28D9;
            --primary-light: #A78BFA;
            --secondary-color: #10B981;
            --background-color: #F3F4F6;
            --background-dark: #1F2937;
            --text-color: #1F2937;
            --text-color-dark: #F9FAFB;
            --error-color: #EF4444;
            --success-color: #10B981;
            --border-radius: 8px;
            --box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        body.dark-mode {
            background-color: var(--background-dark);
            color: var(--text-color-dark);
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            transition: background-color 0.3s;
        }

        body.dark-mode .login-container {
            background-color: #2D3748;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            margin: 0;
            color: var(--primary-color);
            font-size: 2rem;
        }

        .login-header p {
            margin-top: 0.5rem;
            color: #6B7280;
        }

        body.dark-mode .login-header p {
            color: #A0AEC0;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #D1D5DB;
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        body.dark-mode .form-group input {
            background-color: #4A5568;
            border-color: #2D3748;
            color: white;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.3);
        }

        .form-actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            padding: 0.75rem 1rem;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
        }

        .btn-secondary:hover {
            background-color: rgba(139, 92, 246, 0.1);
        }

        body.dark-mode .btn-secondary {
            border-color: var(--primary-light);
            color: var(--primary-light);
        }

        body.dark-mode .btn-secondary:hover {
            background-color: rgba(167, 139, 250, 0.1);
        }

        .toggle-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .toggle-container label {
            margin: 0;
            cursor: pointer;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary-color);
        }

        input:focus + .slider {
            box-shadow: 0 0 1px var(--primary-color);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        .login-footer {
            text-align: center;
            margin-top: 2rem;
            color: #6B7280;
            font-size: 0.875rem;
        }

        body.dark-mode .login-footer {
            color: #A0AEC0;
        }

        .login-footer a {
            color: var(--primary-color);
            text-decoration: none;
        }

        body.dark-mode .login-footer a {
            color: var(--primary-light);
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: var(--error-color);
            background-color: rgba(239, 68, 68, 0.1);
            padding: 0.75rem;
            border-radius: var(--border-radius);
            margin-bottom: 1.5rem;
            display: none;
        }

        .success-message {
            color: var(--success-color);
            background-color: rgba(16, 185, 129, 0.1);
            padding: 0.75rem;
            border-radius: var(--border-radius);
            margin-bottom: 1.5rem;
            display: none;
        }

        .form-toggle {
            margin-top: 1rem;
            text-align: center;
        }

        .form-toggle a {
            color: var(--primary-color);
            text-decoration: none;
            cursor: pointer;
        }

        body.dark-mode .form-toggle a {
            color: var(--primary-light);
        }

        .form-toggle a:hover {
            text-decoration: underline;
        }

        #registerForm {
            display: none;
        }

        .password-container {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #6B7280;
        }

        body.dark-mode .password-toggle {
            color: #A0AEC0;
        }

        .password-toggle:hover {
            color: var(--primary-color);
        }

        body.dark-mode .password-toggle:hover {
            color: var(--primary-light);
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 1.5rem;
                margin: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>AI Map</h1>
            <p>Přihlaste se nebo si vytvořte účet</p>
        </div>

        <div class="toggle-container">
            <label for="darkModeToggle">Tmavý režim</label>
            <label class="switch">
                <input type="checkbox" id="darkModeToggle" checked>
                <span class="slider"></span>
            </label>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">E-mail</label>
                <input type="email" id="loginEmail" required placeholder="Zadejte svůj e-mail">
            </div>
            <div class="form-group">
                <label for="loginPassword">Heslo</label>
                <div class="password-container">
                    <input type="password" id="loginPassword" required placeholder="Zadejte své heslo">
                    <button type="button" class="password-toggle" id="loginPasswordToggle">👁️</button>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Přihlásit se</button>
                <button type="button" class="btn btn-secondary" id="guestLoginBtn">Pokračovat jako host</button>
            </div>
            <div class="form-toggle">
                <a id="showRegisterForm">Nemáte účet? Zaregistrujte se</a>
            </div>
        </form>

        <form id="registerForm">
            <div class="form-group">
                <label for="registerUsername">Uživatelské jméno</label>
                <input type="text" id="registerUsername" required placeholder="Zadejte uživatelské jméno">
            </div>
            <div class="form-group">
                <label for="registerEmail">E-mail</label>
                <input type="email" id="registerEmail" required placeholder="Zadejte svůj e-mail">
            </div>
            <div class="form-group">
                <label for="registerPassword">Heslo</label>
                <div class="password-container">
                    <input type="password" id="registerPassword" required placeholder="Zadejte heslo (min. 8 znaků)">
                    <button type="button" class="password-toggle" id="registerPasswordToggle">👁️</button>
                </div>
            </div>
            <div class="form-group">
                <label for="registerPasswordConfirm">Potvrzení hesla</label>
                <div class="password-container">
                    <input type="password" id="registerPasswordConfirm" required placeholder="Zadejte heslo znovu">
                    <button type="button" class="password-toggle" id="registerPasswordConfirmToggle">👁️</button>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Zaregistrovat se</button>
            </div>
            <div class="form-toggle">
                <a id="showLoginForm">Již máte účet? Přihlaste se</a>
            </div>
        </form>

        <div class="login-footer">
            <p>© 2025 AI Map - Into the known v0.3.8.5</p>
            <p>Vytvořeno s <span style="color: #EF4444;">❤️</span> pro lepší produktivitu</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Přepínání tmavého režimu
            const darkModeToggle = document.getElementById('darkModeToggle');
            const body = document.body;

            // Načtení preference tmavého režimu z localStorage
            const darkMode = localStorage.getItem('aiMapaDarkMode') === 'true';
            darkModeToggle.checked = darkMode;
            if (darkMode) {
                body.classList.add('dark-mode');
            }

            darkModeToggle.addEventListener('change', function() {
                if (this.checked) {
                    body.classList.add('dark-mode');
                    localStorage.setItem('aiMapaDarkMode', 'true');
                } else {
                    body.classList.remove('dark-mode');
                    localStorage.setItem('aiMapaDarkMode', 'false');
                }
            });

            // Přepínání mezi přihlášením a registrací
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const showRegisterForm = document.getElementById('showRegisterForm');
            const showLoginForm = document.getElementById('showLoginForm');

            showRegisterForm.addEventListener('click', function() {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
            });

            showLoginForm.addEventListener('click', function() {
                registerForm.style.display = 'none';
                loginForm.style.display = 'block';
            });

            // Přepínání viditelnosti hesla
            const passwordToggles = document.querySelectorAll('.password-toggle');
            passwordToggles.forEach(toggle => {
                toggle.addEventListener('click', function() {
                    const passwordInput = this.previousElementSibling;
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        this.textContent = '🔒';
                    } else {
                        passwordInput.type = 'password';
                        this.textContent = '👁️';
                    }
                });
            });

            // Zpracování přihlášení
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;

                // Simulace přihlášení
                if (email && password) {
                    // Uložení informace o přihlášení
                    localStorage.setItem('aiMapaLoggedIn', 'true');
                    localStorage.setItem('aiMapaUserEmail', email);

                    // Přesměrování na hlavní stránku
                    window.location.href = 'index.html';
                } else {
                    showError('Zadejte e-mail a heslo');
                }
            });

            // Zpracování registrace
            registerForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const username = document.getElementById('registerUsername').value;
                const email = document.getElementById('registerEmail').value;
                const password = document.getElementById('registerPassword').value;
                const passwordConfirm = document.getElementById('registerPasswordConfirm').value;

                // Validace
                if (!username || !email || !password || !passwordConfirm) {
                    showError('Vyplňte všechna pole');
                    return;
                }

                if (password.length < 8) {
                    showError('Heslo musí mít alespoň 8 znaků');
                    return;
                }

                if (password !== passwordConfirm) {
                    showError('Hesla se neshodují');
                    return;
                }

                // Simulace registrace
                showSuccess('Registrace byla úspěšná! Nyní se můžete přihlásit.');
                registerForm.reset();
                registerForm.style.display = 'none';
                loginForm.style.display = 'block';
            });

            // Přihlášení jako host
            const guestLoginBtn = document.getElementById('guestLoginBtn');
            guestLoginBtn.addEventListener('click', function() {
                localStorage.setItem('aiMapaLoggedIn', 'true');
                localStorage.setItem('aiMapaUserEmail', 'guest@example.com');
                localStorage.setItem('aiMapaIsGuest', 'true');
                window.location.href = 'index.html';
            });

            // Funkce pro zobrazení chybové zprávy
            function showError(message) {
                const errorMessage = document.getElementById('errorMessage');
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';

                // Skrytí zprávy po 5 sekundách
                setTimeout(() => {
                    errorMessage.style.display = 'none';
                }, 5000);
            }

            // Funkce pro zobrazení úspěšné zprávy
            function showSuccess(message) {
                const successMessage = document.getElementById('successMessage');
                successMessage.textContent = message;
                successMessage.style.display = 'block';

                // Skrytí zprávy po 5 sekundách
                setTimeout(() => {
                    successMessage.style.display = 'none';
                }, 5000);
            }

            // Kontrola, zda je uživatel již přihlášen
            const isLoggedIn = localStorage.getItem('aiMapaLoggedIn') === 'true';
            // Přesměrování pouze pokud nejsme na testovací stránce
            if (isLoggedIn && !window.location.href.includes('/tests/')) {
                window.location.href = 'index.html';
            }
        });
    </script>

    <!-- Testovací skripty (pouze pro lokální vývoj) -->
    <script>
        // Kontrola, zda jsme v lokálním vývojovém prostředí
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            // Načtení testovacích skriptů
            const testScripts = [
                '/tests/auth-test.js',
                '/tests/form-test.js',
                '/tests/csp-test.js'
            ];

            testScripts.forEach(script => {
                const scriptElement = document.createElement('script');
                scriptElement.src = script;
                document.head.appendChild(scriptElement);
            });

            // Přidání odkazu na testovací stránku
            document.addEventListener('DOMContentLoaded', () => {
                const testLink = document.createElement('a');
                testLink.href = '/tests/index.html';
                testLink.target = '_blank';
                testLink.textContent = 'Otevřít testovací stránku';
                testLink.style.position = 'fixed';
                testLink.style.bottom = '10px';
                testLink.style.right = '10px';
                testLink.style.padding = '8px 16px';
                testLink.style.backgroundColor = '#6d28d9';
                testLink.style.color = 'white';
                testLink.style.borderRadius = '4px';
                testLink.style.textDecoration = 'none';
                testLink.style.zIndex = '9999';
                document.body.appendChild(testLink);
            });
        }
    </script>
</body>
</html>
