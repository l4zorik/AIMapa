<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Map - Přihlášení</title>
    <link rel="icon" href="app/icons8-favicon.gif" type="image/gif">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .redirect-container {
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h1 {
            color: #8b5cf6;
            margin-bottom: 1rem;
        }

        p {
            margin-bottom: 2rem;
            color: #6b7280;
        }

        .spinner {
            border: 5px solid rgba(139, 92, 246, 0.3);
            border-radius: 50%;
            border-top: 5px solid #8b5cf6;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn {
            padding: 0.75rem 1.5rem;
            background-color: #8b5cf6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background-color: #7c3aed;
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <h1>AI Map - Přihlášení</h1>
        <p>Přesměrováváme vás na přihlašovací stránku Auth0...</p>
        <div class="spinner"></div>
        <a href="index.html" class="btn" id="manualRedirectBtn">Pokračovat ručně</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Přesměrování na hlavní stránku, která zajistí přihlášení přes Auth0
            setTimeout(function() {
                window.location.href = 'index.html';
            }, 2000);
        });
    </script>
</body>
</html>
