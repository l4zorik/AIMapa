# Konfigurace pro nasazení na Netlify
# AIMapa verze 0.3.8.2

[build]
  # Příkaz pro sestavení aplikace
  command = "npm install"
  # Adresář, který se má nasadit
  publish = "public"
  # Funkce pro Netlify
  functions = "functions"

# Proměnné prostředí pro produkci
[build.environment]
  NODE_VERSION = "16.x"

# Přesměrování pro SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Ochrana citlivých souborů - zamezení přístupu
[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env.*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/server.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

# Hlavičky pro zabezpečení
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' https://njjhhamwixjbfibywreo.supabase.co https://unpkg.com https://cdn.osmbuildings.org; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.osmbuildings.org; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https://*.tile.openstreetmap.org https://*.tile.osm.org https://*.tile.thunderforest.com; connect-src 'self' https://njjhhamwixjbfibywreo.supabase.co https://api.openrouteservice.org;"
