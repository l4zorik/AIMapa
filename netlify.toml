# Netlify konfigurace pro AIMapa
# Verze 0.3.8.5

# Základní nastavení buildu
[build]
  # Adresář, který bude nasazen (výchozí je public)
  publish = "public"
  # Funkce pro serverless funkce
  functions = "functions"

# Nastavení pro produkční prostředí
[context.production]
  # Proměnné prostředí pro produkci
  environment = { NODE_VERSION = "16" }

# Nastavení pro vývojové prostředí
[context.branch-deploy]
  # Proměnné prostředí pro vývojové větve
  environment = { NODE_VERSION = "16" }

# Nastavení pro deploy preview
[context.deploy-preview]
  # Proměnné prostředí pro náhledy
  environment = { NODE_VERSION = "16" }

# Přesměrování a hlavičky
[[redirects]]
  # Přesměrování všech požadavků na index.html pro SPA
  from = "/*"
  to = "/index.html"
  status = 200

# Nastavení hlaviček pro bezpečnost
[[headers]]
  # Hlavičky pro všechny stránky
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self' https://cdn.jsdelivr.net https://*.supabase.co https://*.openstreetmap.org https://*.tile.openstreetmap.org https://unpkg.com https://*.unpkg.com https://*.osmbuildings.org https://cesium.com https://*.cesium.com https://*.netlify.app https://*.netlify.com https://*.auth0.com https://cdn.auth0.com data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://*.supabase.co https://unpkg.com https://*.unpkg.com https://leafletjs.com https://*.leafletjs.com https://osmbuildings.org https://*.osmbuildings.org https://cesium.com https://*.cesium.com https://*.netlify.app https://*.netlify.com https://code.jquery.com https://cdnjs.cloudflare.com https://*.auth0.com https://cdn.auth0.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://*.unpkg.com https://leafletjs.com https://*.leafletjs.com https://osmbuildings.org https://*.osmbuildings.org https://cesium.com https://*.cesium.com https://*.netlify.app https://*.netlify.com https://*.auth0.com https://cdn.auth0.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://via.placeholder.com https://unpkg.com https://*.unpkg.com https://*.supabase.co https://*.openstreetmap.org https://*.tile.openstreetmap.org https://leafletjs.com https://*.leafletjs.com https://osmbuildings.org https://*.osmbuildings.org https://cesium.com https://*.cesium.com https://*.netlify.app https://*.netlify.com https://*.auth0.com https://cdn.auth0.com https://s.gravatar.com; connect-src 'self' https://*.supabase.co https://*.openstreetmap.org https://*.tile.openstreetmap.org https://unpkg.com https://*.unpkg.com https://leafletjs.com https://*.leafletjs.com https://osmbuildings.org https://*.osmbuildings.org https://cesium.com https://*.cesium.com https://*.netlify.app https://*.netlify.com https://router.project-osrm.org https://api.openrouteservice.org wss://*.supabase.co https://*.auth0.com; frame-src 'self' https://*.auth0.com;"

# Nastavení pro Supabase a Node.js
[build.environment]
  # Proměnné prostředí pro Supabase budou nastaveny automaticky Netlify
  SUPABASE_PROJECT = "AI Mapa"
  NODE_VERSION = "16"
